<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src file:; script-src file:; font-src file:">
<title>Prxy TV</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<div class="bg"></div>
<div class="backdrop" id="bd0"></div><div class="backdrop" id="bd1"></div>
<div class="veil"></div>
<nav class="rail glass" id="rail" aria-label="Sections"></nav>
<header class="top">
  <div class="chips" id="chips"></div>
  <div class="chip clock"><span id="time" class="time">--:--</span><span id="date" class="date"></span></div>
</header>
<main id="main"></main>
<footer class="hints">
  <span><kbd>OK</kbd> open</span><span><kbd>Hold OK</kbd> pin or manage</span><span><kbd>Back</kbd> home / leave</span>
</footer>
<div id="menu" class="scrim" hidden></div>
<div id="saver" class="saver" hidden><div id="saver-box" class="saver-box"><div id="s-time" class="s-time"></div><div id="s-date" class="s-date"></div><div id="s-extra" class="s-extra"></div></div></div>
<script src="launcher.js"></script>
</body>
</html>
